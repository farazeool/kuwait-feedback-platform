name: CI

on:
  push:
    branches: [main, milestone-*]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 50

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npx next build

      - name: Check working tree
        run: git diff --exit-code
