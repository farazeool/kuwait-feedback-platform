name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - milestone-7-production-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      SUPABASE_PROJECT_ENVIRONMENT: local
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-server-only-key
      SUBMISSION_FINGERPRINT_SECRET: ci-fingerprint-secret-with-at-least-32-characters
      BOT_PROTECTION_PROVIDER: disabled
      BOT_PROTECTION_BYPASS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4 # trusted maintained major release
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:localization
      - run: npm run security:secrets
      - run: npm run security:client-boundary
      - run: npm run db:validate:migrations
      - run: npm run build
      - run: npm run security:bundle
      - run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4 # trusted maintained major release
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run db:test:authorization
      - run: npm run db:test:performance
      - run: npm run db:types
      - run: git diff --exit-code -- src/types/database.ts
